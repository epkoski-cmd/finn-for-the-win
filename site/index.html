<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finn to Win</title>
<meta name="description" content="Finnish footballers playing abroad today, and where to watch them in Finland.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a single column of match "fixture cards", like a matchday programme.
   A strip of day buttons at the top; Finland's own matches get a blue band. */
:root {
  --bg: #f3f5f9;          /* cool off-white, nudged toward the blue accent */
  --surface: #ffffff;
  --fg: #142033;
  --muted: #5b6a80;
  --line: #dde3ec;
  --accent: #1a4fa0;      /* Finnish flag blue */
  --accent-soft: #e4ecf8;
  --accent-fg: #ffffff;
  --good: #1e7a4c;  --good-soft: #e1f3e9;
  --warn: #8a5a00;  --warn-soft: #fbf0d9;
  --quiet-soft: #eef1f5;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1522; --surface: #162034; --fg: #e8edf5; --muted: #95a3b8; --line: #263349;
    --accent: #7fa8ea; --accent-soft: #1d2d4a; --accent-fg: #0e1522;
    --good: #6fd19c; --good-soft: #163527; --warn: #f0c060; --warn-soft: #3a2e14; --quiet-soft: #1d283c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1522; --surface: #162034; --fg: #e8edf5; --muted: #95a3b8; --line: #263349;
  --accent: #7fa8ea; --accent-soft: #1d2d4a; --accent-fg: #0e1522;
  --good: #6fd19c; --good-soft: #163527; --warn: #f0c060; --warn-soft: #3a2e14; --quiet-soft: #1d283c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
  display: grid; gap: 20px;
}

header { display: grid; gap: 4px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h1 .cross { color: var(--accent); }
.tagline { margin: 0; color: var(--muted); }

/* Day strip */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.day {
  flex: 0 0 auto; min-width: 64px; display: grid; justify-items: center; gap: 0;
  padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; font: inherit;
}
.day .dow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.day .dnum { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day .count { font-size: 0.72rem; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.day[aria-pressed="true"] .dow, .day[aria-pressed="true"] .count { color: var(--accent-fg); opacity: 0.85; }
.day:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.summary { margin: 0; color: var(--muted); font-size: 0.92rem; }
.summary strong { color: var(--fg); }

/* Match cards */
.list { display: grid; gap: 12px; }
.match {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  display: grid; grid-template-columns: 64px 1fr; overflow: hidden;
}
.time {
  font-family: var(--display); font-weight: 600; font-size: 1.4rem; font-variant-numeric: tabular-nums;
  padding: 14px 0 14px 14px;
}
.body { padding: 14px 14px 12px 6px; display: grid; gap: 10px; min-width: 0; }
.comp { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.team { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.team.away { text-align: right; }
.team.finnish::after { content: " ●"; color: var(--accent); font-size: 0.7em; vertical-align: 0.15em; }
.team.away.finnish::after { content: ""; }
.team.away.finnish::before { content: "● "; color: var(--accent); font-size: 0.7em; vertical-align: 0.15em; }
.score {
  font-family: var(--display); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums;
  padding: 0 10px; border-radius: 6px; background: var(--quiet-soft); line-height: 1.5; white-space: nowrap;
}
.score.vs { font-size: 1rem; font-weight: 500; color: var(--muted); background: none; }

.finns { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.finn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.finn .name { font-weight: 500; }
.finn .club { color: var(--muted); font-size: 0.85rem; }
.role { font-size: 0.72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.role.started { background: var(--good-soft); color: var(--good); }
.role.came-on { background: var(--accent-soft); color: var(--accent); }
.role.unused-sub, .role.not-in-squad { background: var(--quiet-soft); color: var(--muted); }

details.squad summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: 0.9rem; }
details.squad .finns { margin-top: 6px; }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.lineup-note { margin: 0; font-size: 0.82rem; color: var(--muted); font-style: italic; }
.watch { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; font-size: 0.9rem; min-width: 0; }
.watch .label { color: var(--muted); }
.watch .svc { font-weight: 600; }
.watch a.svc { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.watch a.svc:hover { text-decoration-thickness: 2px; }
.watch .free { font-size: 0.72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.watch .unsure { font-size: 0.72rem; color: var(--warn); }
.watch.none .svc { font-weight: 400; color: var(--muted); }
.link-btn { background: none; border: 0; padding: 2px 0; font: inherit; font-size: 0.82rem; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link-btn:hover { color: var(--fg); }

/* Finland's own matches */
.match.nt { border-color: var(--accent); }
.match.nt .time { background: var(--accent); color: var(--accent-fg); padding-right: 10px; }
.match.nt .body { padding-left: 14px; }
.nt-flag { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }


.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--display); font-size: 1.3rem; font-weight: 600; margin-bottom: 4px; }

footer { color: var(--muted); font-size: 0.82rem; display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
footer p { margin: 0; }

@media (max-width: 480px) {
  h1 { font-size: 2.1rem; }
  .match { grid-template-columns: 52px 1fr; }
  .time { font-size: 1.15rem; padding-left: 10px; }
  .teams { grid-template-columns: 1fr; gap: 2px; }
  .team.away { text-align: left; }
  .team.away.finnish::before { content: ""; }
  .team.away.finnish::after { content: " ●"; color: var(--accent); font-size: 0.7em; vertical-align: 0.15em; }
  .score { justify-self: start; }
}
@media (prefers-reduced-motion: no-preference) {
  .day { transition: background-color 120ms, color 120ms; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Finn <span class="cross">to Win</span></h1>
    <p class="tagline">Finnish footballers playing abroad today, and where to watch them in Finland.</p>
  </header>

  <nav class="days" id="days" aria-label="Choose a day"></nav>
  <p class="summary" id="summary">Loading matches…</p>
  <section class="list" id="list" aria-live="polite"></section>

  <footer>
    <p id="updated"></p>
    <p>Times are Finnish time. Match data from public sports data feeds, and it may contain errors. Streaming info is checked by hand.</p>
    <p><a class="link-btn" id="general-report" target="_blank" rel="noopener">Spotted an error? Tell us</a></p>
  </footer>
</div>

<script>
// ---------------------------------------------------------------------------
// 1. Load the data file that find_finns.py produced.
//    This is the "website reads the saved file" half of the system.
// ---------------------------------------------------------------------------
let data = null;          // the contents of matches.json
let selectedDay = null;   // e.g. "2026-11-17"

const ROLE_LABELS = {
  "started": "Started",
  "came on": "Came on",
  "unused sub": "On the bench",
  "not in squad": "Not in squad",
};

// Today's date in Finland, whatever time zone the visitor is in.
function todayInFinland() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Helsinki" }).format(new Date());
}

async function loadData() {
  try {
    // "no-cache" = always ask the server whether a newer file exists,
    // instead of reusing the browser's saved copy for up to 10 minutes.
    const response = await fetch("data/matches.json", { cache: "no-cache" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    data = await response.json();
  } catch (err) {
    document.getElementById("summary").textContent =
      "The match list couldn't be loaded. Try reloading the page.";
    return;
  }
  const today = todayInFinland();
  selectedDay = data.days.includes(today) ? today : data.days[Math.floor(data.days.length / 2)];
  renderDays();
  renderMatches();
  const generated = new Date(data.generated);
  document.getElementById("updated").textContent =
    "Updated " + generated.toLocaleString("fi-FI", { timeZone: "Europe/Helsinki", dateStyle: "short", timeStyle: "short" }) + ".";
}

// ---------------------------------------------------------------------------
// 2. Draw the page from the data.
// ---------------------------------------------------------------------------
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function matchesOn(day) {
  return data.matches.filter(m => m.date_fi === day);
}

function renderDays() {
  const strip = document.getElementById("days");
  strip.replaceChildren();
  const today = todayInFinland();
  for (const day of data.days) {
    const d = new Date(day + "T12:00:00");
    const button = el("button", "day");
    button.type = "button";
    button.setAttribute("aria-pressed", String(day === selectedDay));
    const dow = day === today ? "Today" : d.toLocaleDateString("en-GB", { weekday: "short" });
    button.append(
      el("span", "dow", dow),
      el("span", "dnum", d.getDate() + "." + (d.getMonth() + 1) + "."),
      el("span", "count", matchesOn(day).length + (matchesOn(day).length === 1 ? " match" : " matches")),
    );
    button.addEventListener("click", () => {
      selectedDay = day;
      renderDays();
      renderMatches();
    });
    strip.append(button);
  }
  strip.querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: "center", block: "nearest" });
}

function renderMatches() {
  const list = document.getElementById("list");
  list.replaceChildren();
  const matches = matchesOn(selectedDay);

  const finnCount = matches.reduce((n, m) => n + m.home.finns.length + m.away.finns.length, 0);
  const summary = document.getElementById("summary");
  summary.replaceChildren();
  if (matches.length) {
    summary.append(el("strong", null, matches.length + (matches.length === 1 ? " match" : " matches")),
      " with Finnish players" + (finnCount ? " · " + finnCount + " Finns" : ""));
  } else {
    summary.textContent = "";
    const empty = el("div", "empty");
    empty.append(el("strong", null, "No Finns playing this day"),
      "Pick another day above. International breaks and winter pauses leave some days empty.");
    list.append(empty);
    return;
  }
  for (const m of matches) list.append(matchCard(m));
}

function finnItem(finn, clubName) {
  const li = el("li", "finn");
  li.append(el("span", "name", finn.name));
  if (clubName) li.append(el("span", "club", clubName));
  if (finn.role) li.append(el("span", "role " + finn.role.replace(/ /g, "-"), ROLE_LABELS[finn.role] || finn.role));
  return li;
}

function matchCard(m) {
  const card = el("article", "match" + (m.national_team ? " nt" : ""));
  card.append(el("div", "time", m.kickoff_fi));
  const body = el("div", "body");

  // Competition + teams + score
  const comp = el("div", m.national_team ? "nt-flag" : "comp",
    m.national_team ? "Finland national team · " + m.league_name : m.league_name);
  const teams = el("div", "teams");
  const home = el("div", "team home" + (m.home.finns.length ? " finnish" : ""), m.home.name);
  const away = el("div", "team away" + (m.away.finns.length ? " finnish" : ""), m.away.name);
  const played = m.state !== "pre";
  const score = el("div", "score" + (played ? "" : " vs"), played ? m.home.score + "–" + m.away.score : "vs");
  teams.append(home, score, away);
  body.append(comp, teams);

  // The Finns
  if (m.national_team) {
    const side = m.home.id === "458" ? m.home : m.away;
    if (side.finns.length) {
      const details = el("details", "squad");
      details.append(el("summary", null, side.finns.length + " Finns played"));
      const ul = el("ul", "finns");
      side.finns.forEach(f => ul.append(finnItem(f)));
      details.append(ul);
      body.append(details);
    } else {
      body.append(el("p", "lineup-note", "Lineup not confirmed yet. Lineups are usually announced about an hour before kickoff."));
    }
  } else {
    const ul = el("ul", "finns");
    for (const side of [m.home, m.away]) side.finns.forEach(f => ul.append(finnItem(f, side.name)));
    body.append(ul);
    if (!played) {
      body.append(el("p", "lineup-note", "Lineup not confirmed yet. These Finns are in the club's squad, but may not play."));
    }
  }

  // Where to watch + report button
  const foot = el("div", "foot");
  const watch = el("div", "watch" + (m.watch ? "" : " none"));
  watch.append(el("span", "label", "Watch:"));
  if (m.watch) {
    // Confirmed services become a link to that league's page on the service.
    if (m.watch.url && m.watch.confidence === "official") {
      const link = el("a", "svc", m.watch.service + " ↗");
      link.href = m.watch.url;
      link.target = "_blank";
      link.rel = "noopener";
      watch.append(link);
    } else {
      watch.append(el("span", "svc", m.watch.service));
    }
    if (m.watch.free) watch.append(el("span", "free", "Free"));
    if (m.watch.coverage === "selected") watch.append(el("span", "unsure", "selected matches only"));
    if (m.watch.confidence !== "official") watch.append(el("span", "unsure", "unconfirmed"));
  } else {
    watch.append(el("span", "svc", "No known Finnish broadcaster"));
  }
  const reportLink = el("a", "link-btn", "Spotted an error?");
  reportLink.href = reportUrl(m);
  reportLink.target = "_blank";
  reportLink.rel = "noopener";
  foot.append(watch, reportLink);
  body.append(foot);

  card.append(body);
  return card;
}

// ---------------------------------------------------------------------------
// 3. "Spotted an error?" links.
//    Reports go to a Google Form. A match's link opens the form with the
//    match already filled in ("pre-filled"), so the visitor only writes
//    what's wrong.
// ---------------------------------------------------------------------------
const REPORT_FORM = "https://docs.google.com/forms/d/e/1FAIpQLScvbtU5Vaj0a89T3tFMCZCJkWVmOl59chMgaz5YRGPupqtWaA/viewform";
const MATCH_FIELD = "entry.2096274022";   // the form's "Which match?" question

function reportUrl(match) {
  if (!match) return REPORT_FORM;
  const [y, mo, d] = match.date_fi.split("-").map(Number);
  const label = match.home.name + " – " + match.away.name + ", " + d + "." + mo + "." + y + " (" + match.league_name + ")";
  return REPORT_FORM + "?usp=pp_url&" + MATCH_FIELD + "=" + encodeURIComponent(label);
}

document.getElementById("general-report").href = reportUrl(null);

loadData();
</script>
</body>
</html>
