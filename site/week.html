<link rel="stylesheet" href="style.css?v=__VERSION__">
<style>
/* Only for this page; everything else comes from style.css */
.period { margin: 0; color: var(--muted); }
.period strong { color: var(--fg); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 0; }
.tile .num { font-family: var(--display); font-weight: 700; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .lbl { font-size: 0.78rem; color: var(--muted); }
@media (max-width: 480px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; display: grid; gap: 10px; }
.block h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.2; }
.block .note { margin: 0; font-size: 0.85rem; color: var(--muted); }
.block.nt { border-color: var(--accent); }
.results { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.results li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.results .res { font-weight: 600; }
.results .when { font-size: 0.82rem; color: var(--muted); }
.detail { font-size: 0.82rem; color: var(--muted); flex-basis: 100%; }
.share { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.share-btn { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 9px 18px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
.share-btn:hover { filter: brightness(1.08); }
.share-status { font-size: 0.85rem; color: var(--muted); }
.count-pill { font-size: 0.78rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--quiet-soft); white-space: nowrap; }
</style>
</head>
<body data-title="weekPageTitle">

<div class="wrap">
  <header>
    <div class="top">
      <h1><a href="./">Finn <span class="cross">FTW</span></a></h1>
      <div class="lang" id="lang" role="group"></div>
    </div>
    <p class="tagline"><strong>Finn for the Win.</strong> <span data-t="tagline">Finnish footballers playing abroad today, and where to watch them in Finland.</span></p>
    <nav class="pages" data-t-label="navLabel"><a href="./" data-t="navMatches">Matches</a><a href="week.html" aria-current="page" data-t="navWeek">This week</a><a href="finns.html" data-t="navFinns">All Finns</a></nav>
    <div class="switch gender" id="gender" role="group"></div>
  </header>

  <p class="period" id="period" data-t="loadingWeek">Loading…</p>
  <div class="tiles" id="tiles"></div>
  <div class="share" id="share" hidden>
    <button type="button" class="share-btn" id="share-btn"></button>
    <span class="share-status" id="share-status" aria-live="polite"></span>
  </div>
  <div id="sections" class="list"></div>

  <footer>
    <p id="updated"></p>
    <p data-t="weekFooter">Counts finished matches from the last 7 days. Assists may be missing for some matches.</p>
    <p><a class="link-btn" id="report" target="_blank" rel="noopener" data-t="reportGeneral">Spotted an error? Tell us</a></p>
  </footer>
</div>

<script src="texts.js?v=__VERSION__"></script>
<script src="shared.js?v=__VERSION__"></script>
<script src="weekdata.js?v=__VERSION__"></script>
<script src="share.js?v=__VERSION__"></script>
<script>
// ---------------------------------------------------------------------------
// This page draws the last 7 days. The adding up happens in weekdata.js,
// which the link preview picture (preview.html) uses too.
// ---------------------------------------------------------------------------
let history = null;
let clubs = new Map();   // player ID -> club, from the "All Finns" list

async function loadData() {
  try {
    ({ history, clubs } = await fetchWeekData());
  } catch (err) {
    if (!history) document.getElementById("period").textContent = t("weekError");
    return;
  }
  render();
}

function resultText(m) {
  return m.home.name + " " + m.home.score + "–" + m.away.score + " " + m.away.name;
}

function playerRow(p, extras, detail) {
  const li = el("li", "finn" + (isFavourite(p.id) ? " is-fav" : ""));
  const info = el("span", "info");
  li.append(starButton(p.id, p.name), info);
  info.append(el("span", "name", p.name), el("span", "club", p.club), ...extras);
  if (detail) info.append(el("span", "detail", detail));
  return li;
}

function block(title, rows, note, extraClass) {
  const box = el("section", "block" + (extraClass ? " " + extraClass : ""));
  box.append(el("h2", null, title));
  if (note) box.append(el("p", "note", note));
  const ul = el("ul", "finns");
  rows.forEach(r => ul.append(r));
  box.append(ul);
  return box;
}

function render() {
  if (!history) return;
  const week = weekSummary(history, clubs);
  const { from, to, matches, players, played, goals, assists, scorers, assisters } = week;

  document.getElementById("period").replaceChildren(
    t("weekPeriod"), el("strong", null, shortDate(from) + " – " + shortDate(to)));
  document.getElementById("updated").textContent = updatedText(history.generated);

  const tiles = document.getElementById("tiles");
  tiles.replaceChildren();
  for (const [num, label] of [[played.length, t("tilePlayed")], [goals, t("tileGoals")],
                              [assists, t("tileAssists")], [matches.length, t("tileMatches")]]) {
    const tile = el("div", "tile");
    tile.append(el("span", "num", String(num)), el("span", "lbl", label));
    tiles.append(tile);
  }

  const sections = document.getElementById("sections");
  sections.replaceChildren();
  updateShare(week);   // the "Share this week as an image" button

  if (!matches.length) {
    const empty = el("div", "empty");
    empty.append(el("strong", null, t("weekEmptyTitle")), t("weekEmptyText"));
    sections.append(empty);
    return;
  }

  // Finland's own results: men's team and Helmarit in separate boxes
  for (const isWomen of [false, true]) {
    const nt = matches.filter(m => m.national_team && Boolean(m.women) === isWomen);
    if (!nt.length) continue;
    const box = el("section", "block nt");
    box.append(el("h2", null, nationalTeamName(isWomen)));
    const ul = el("ul", "results");
    for (const m of nt) {
      const li = el("li");
      li.append(el("span", "res", resultText(m)), el("span", "when", leagueName(m.league, m.league_name) + " · " + shortDate(m.date_fi)));
      ul.append(li);
    }
    box.append(ul);
    sections.append(box);
  }

  // Goals and assists, most first
  if (scorers.length) {
    sections.append(block(t("weekGoals"), scorers.map(p => playerRow(p,
      [el("span", "count-pill", "⚽ " + p.goalCount)],
      p.goals.map(g => resultText(g.match) + ", " + shortDate(g.match.date_fi)).join(" · ")))));
  }
  if (assisters.length) {
    sections.append(block(t("weekAssists"), assisters.map(p => playerRow(p,
      [el("span", "count-pill", "🅰️ " + p.assistCount)],
      p.assists.map(a => resultText(a.match) + ", " + shortDate(a.match.date_fi)).join(" · ")))));
  }

  // Everyone who played, most appearances first
  played.sort((a, b) => (b.started + b.cameOn) - (a.started + a.cameOn) || b.started - a.started || byName(a, b));
  sections.append(block(t("weekPlayed"), played.map(p => {
    const pills = [];
    if (p.started) pills.push(el("span", "role started", t("roles")["started"] + (p.started > 1 ? " " + p.started + "×" : "")));
    if (p.cameOn) pills.push(el("span", "role came-on", t("roles")["came on"] + (p.cameOn > 1 ? " " + p.cameOn + "×" : "")));
    return playerRow(p, pills);
  })));

  // Finns whose team played, but who didn't get on the pitch all week
  const unused = players.filter(p => p.started + p.cameOn === 0).sort(byName);
  if (unused.length) {
    sections.append(block(t("weekDidntPlay"), unused.map(p => {
      const pills = [];
      if (p.bench) pills.push(el("span", "role unused-sub", t("roles")["unused sub"] + (p.bench > 1 ? " " + p.bench + "×" : "")));
      if (p.notInSquad) pills.push(el("span", "role not-in-squad", t("roles")["not in squad"] + (p.notInSquad > 1 ? " " + p.notInSquad + "×" : "")));
      return playerRow(p, pills);
    }), t("weekDidntPlayNote")));
  }
}

function redraw() {
  document.getElementById("report").href = reportFormUrl(t("reportWeekForm"));
  render();
}
const redrawGenderSwitch = setUpGenderSwitch(redraw);
setUpLanguageSwitch(() => { redrawGenderSwitch(); redraw(); });
setUpShareButton();
redraw();
loadData();
keepUpToDate(loadData);
</script>

<script data-goatcounter="https://finnftw.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
