# GitHub Actions workflow: GitHub's servers follow these steps automatically.
#
# In plain words: "Four times a day, start a fresh computer, download our
# code, run find_finns.py, and publish the site folder with the new data."

name: Update site

on:
  schedule:
    # Times are UTC. 04, 10, 16 and 22 UTC = 06, 12, 18 and 00 Finnish winter time.
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:      # adds a "Run workflow" button on GitHub, for running it by hand
  push:
    branches: [main]      # also run whenever new code is uploaded...
    paths-ignore:         # ...except when only notes change (IDEAS.md, README.md etc.):
      - "**.md"           # they aren't part of the site, so no need to ask ESPN again

# Permissions this workflow needs: read the code, publish to GitHub Pages
# (pages + id-token), and find the packaged site between the two jobs (actions).
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Never run two updates at once.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, like GitHub's own example: "build" makes the site and packages
# it, then "publish" puts that package online. As one job, the publish step
# sometimes looked for the package a split second after the upload, before
# GitHub had it listed, and failed ("No artifacts named github-pages").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The list of Finnish players takes ~550 requests to build, so we keep
      # it between runs. find_finns.py rebuilds it by itself once it's a week old
      # (a day old during transfer windows).
      - name: Reuse this week's player list
        uses: actions/cache@v6
        with:
          path: data/finnish_players.json
          key: finnish-players-${{ github.run_id }}
          restore-keys: finnish-players-

      # The match history (for the weekly summary) is kept on the live site
      # itself: download the published copy, and the script adds to it.
      # If it doesn't exist yet, carry on without it (the script then fills in the week).
      - name: Download the match history from the live site
        run: |
          mkdir -p data
          curl -fsSL https://epkoski-cmd.github.io/finn-for-the-win/data/history.json -o data/history.json || rm -f data/history.json
          # Same for the list of everyone who has played for Finland lately.
          curl -fsSL https://epkoski-cmd.github.io/finn-for-the-win/data/national_team_players.json -o data/national_team_players.json || rm -f data/national_team_players.json

      - name: Find the Finns' matches
        run: python find_finns.py

      - name: Put the data next to the web page
        run: |
          mkdir -p site/data
          cp data/matches.json site/data/matches.json
          cp data/players.json site/data/players.json
          cp data/history.json site/data/history.json
          cp data/national_team_players.json site/data/national_team_players.json
          # One calendar file per player, for "Subscribe in calendar"
          rm -rf site/calendars
          cp -r data/calendars site/calendars

      # Stamp the code version into the pages and files, so browsers never
      # mix new pages with old saved files, and open tabs can spot an update.
      # The version only changes when the code changes, not on data refreshes.
      - name: Stamp the site version
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/__VERSION__/$VERSION/g" site/*.html site/*.js
          echo "{\"version\": \"$VERSION\"}" > site/version.json
          # The week's link preview picture changes on every run, so its
          # address gets the date and hour. Apps then fetch the new one.
          sed -i "s/__PREVIEW_STAMP__/$(date -u +%Y%m%d%H)/g" site/*.html

      # Link preview pictures: shown when a link is pasted into WhatsApp etc.
      # Google Chrome is already installed on GitHub's computer. We open our
      # hidden page preview.html in Chrome without a window ("headless") and
      # save screenshots of it. If this step fails, the site is still published.
      - name: Draw the link preview pictures
        continue-on-error: true
        run: |
          cd site
          python -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          for card in site week; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=10000 \
              --screenshot="$PWD/preview-$card.png" "http://localhost:8000/preview.html?card=$card"
          done
          ls -l preview-*.png

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    needs: build            # starts only after "build" has finished
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
