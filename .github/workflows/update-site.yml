# GitHub Actions workflow: GitHub's servers follow these steps automatically.
#
# In plain words: "Four times a day, start a fresh computer, download our
# code, run find_finns.py, and publish the site folder with the new data."

name: Update site

on:
  schedule:
    # Times are UTC. 04, 10, 16 and 22 UTC = 06, 12, 18 and 00 Finnish winter time.
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:      # adds a "Run workflow" button on GitHub, for running it by hand
  push:
    branches: [main]      # also run whenever new code is uploaded

# Permissions this workflow needs: read the code, publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two updates at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The list of Finnish players takes ~550 requests to build, so we keep
      # it between runs. find_finns.py rebuilds it by itself once it's a week old.
      - name: Reuse this week's player list
        uses: actions/cache@v4
        with:
          path: data/finnish_players.json
          key: finnish-players-${{ github.run_id }}
          restore-keys: finnish-players-

      # The match history (for the weekly summary) is kept on the live site
      # itself: download the published copy, and the script adds to it.
      # If it doesn't exist yet, carry on without it (the script then fills in the week).
      - name: Download the match history from the live site
        run: |
          mkdir -p data
          curl -fsSL https://epkoski-cmd.github.io/finn-for-the-win/data/history.json -o data/history.json || rm -f data/history.json

      - name: Find the Finns' matches
        run: python find_finns.py

      - name: Put the data next to the web page
        run: |
          mkdir -p site/data
          cp data/matches.json site/data/matches.json
          cp data/players.json site/data/players.json
          cp data/history.json site/data/history.json

      # Stamp the code version into the pages and files, so browsers never
      # mix new pages with old saved files, and open tabs can spot an update.
      # The version only changes when the code changes, not on data refreshes.
      - name: Stamp the site version
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/__VERSION__/$VERSION/g" site/*.html site/*.js
          echo "{\"version\": \"$VERSION\"}" > site/version.json

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
